name: Build and update retail store GitOps

on: workflow_dispatch

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'retail-eks' }}
  IMAGE_TAG: ${{ github.sha }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

concurrency:
  group: retail-store-gitops
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cart
            context: src/cart
            image: retail-store/cart
          - service: catalog
            context: src/catalog
            image: retail-store/catalog
          - service: checkout
            context: src/checkout
            image: retail-store/checkout
          - service: orders
            context: src/orders
            image: retail-store/orders
          - service: ui
            context: src/ui
            image: retail-store/ui
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR 2
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

  update-gitops:
    name: Update Helm image tags
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure AWS credentials 2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR registry
        id: registry
        run: echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Update chart image values
        uses: mikefarah/yq@v4.45.1
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          REGISTRY: ${{ steps.registry.outputs.registry }}
        with:
          cmd: |
            yq -i '
              .cart.image.repository = strenv(REGISTRY) + "/retail-store/cart" |
              .cart.image.tag = strenv(IMAGE_TAG) |
              .catalog.image.repository = strenv(REGISTRY) + "/retail-store/catalog" |
              .catalog.image.tag = strenv(IMAGE_TAG) |
              .checkout.image.repository = strenv(REGISTRY) + "/retail-store/checkout" |
              .checkout.image.tag = strenv(IMAGE_TAG) |
              .orders.image.repository = strenv(REGISTRY) + "/retail-store/orders" |
              .orders.image.tag = strenv(IMAGE_TAG) |
              .ui.image.repository = strenv(REGISTRY) + "/retail-store/ui" |
              .ui.image.tag = strenv(IMAGE_TAG)
            ' charts/retail-store/values.yaml

      - name: Commit image tag changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/retail-store/values.yaml
          if git diff --cached --quiet; then
            echo "Image tags are already up to date."
            exit 0
          fi
          git commit -m "chore(gitops): update images to ${IMAGE_TAG}"
          git push

      - name: Enable Argo CD auto-sync after images are pushed
        run: |
          set -euo pipefail
          cluster_version="$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.version' \
            --output text)"
          kubectl_version="$(curl -fsSL "https://dl.k8s.io/release/stable-${cluster_version}.txt")"
          curl -fsSLo "$RUNNER_TEMP/kubectl" \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP:$PATH"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --kubeconfig "$KUBECONFIG"
          kubectl auth can-i patch applications.argoproj.io/retail-store --namespace argocd
          kubectl patch application retail-store \
            --namespace argocd \
            --type merge \
            --patch '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'

          deadline=$((SECONDS + 1800))
          while true; do
            sync_status="$(kubectl get application retail-store \
              --namespace argocd \
              --output 'jsonpath={.status.sync.status}' 2>/dev/null || true)"
            health_status="$(kubectl get application retail-store \
              --namespace argocd \
              --output 'jsonpath={.status.health.status}' 2>/dev/null || true)"
            echo "Argo CD application: sync=${sync_status:-Unknown}, health=${health_status:-Unknown}"
            if [[ "$sync_status" == "Synced" && "$health_status" == "Healthy" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for the Argo CD application to become Synced and Healthy."
              exit 1
            fi
            sleep 15
          done
