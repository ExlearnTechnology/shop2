name: Build and update retail store GitOps

on: workflow_dispatch

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: retail-store-gitops
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cart
            context: src/cart
            image: retail-store/cart
          - service: catalog
            context: src/catalog
            image: retail-store/catalog
          - service: checkout
            context: src/checkout
            image: retail-store/checkout
          - service: orders
            context: src/orders
            image: retail-store/orders
          - service: ui
            context: src/ui
            image: retail-store/ui
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

